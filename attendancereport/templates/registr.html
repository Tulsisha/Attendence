<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Register</title>
  </head>
<body class="bg-light">
    <main class="d-flex align-items-center justify-content-center vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4">
                            <h4 class="card-title text-center mb-2">Sign Up</h4>
                            <p class="text-muted small text-center mb-4">Enter your credentials to continue</p>
                            <form id="form" action="/registeruser/" method="POST">
                                <h2>{{msg}}</h2>
                                {% csrf_token %}
                                 <div class="form-floating mb-3">
                                    <input type="email" name="email" class="form-control" id="floatingUsername" placeholder="Username" autocomplete="username" required>
                                    <label for="floatingUsername">Email id</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="text" name="username" class="form-control" id="floatingUsername" placeholder="Username" autocomplete="username" required>
                                    <label for="floatingUsername">Username</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" autocomplete="current-password" required>
                                    <label for="floatingPassword">Password</label>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="rememberCheck">
                                        <label class="form-check-label small" for="rememberCheck">Remember me</label>
                                    </div>
                                    <a href="#" class="small">Forgot?</a>
                                </div>
                                <div class="d-grid">
                                    <button class="btn btn-primary btn-lg" type="submit">Register User</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <p class="text-center text-muted small mt-3">I have an already account! <a href="loginn">Login</a></p>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
