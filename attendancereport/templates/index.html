<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Attendance Panel</title>

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo d-flex align-items-center p-3">
      <img src="/static/images/logo.png" alt="logo" style="width:40px;margin-right:8px;">
      <span>Vashudevay Tech Info</span>
    </div>
    <ul class="list-unstyled ps-3">
      <li><a href="#" class="text-decoration-none d-block py-2"><i class="bi bi-clock me-2"></i>Punch</a></li>
      <li><a href="#" class="text-decoration-none d-block py-2"><i class="bi bi-box-arrow-right me-2"></i>Punch Out</a></li>
      <li><a href="#" class="text-decoration-none d-block py-2"><i class="bi bi-calendar-check me-2"></i>Attendance</a></li>
      <li><a href="#" class="text-decoration-none d-block py-2"><i class="bi bi-airplane me-2"></i>Leave</a></li>
      <li><a href="#" class="text-decoration-none d-block py-2"><i class="bi bi-key me-2"></i>Reset Password</a></li>
      <li><a href="#" class="text-decoration-none d-block py-2"><i class="bi bi-cash me-2"></i>View Salary</a></li>
      <li><a href="#" class="text-decoration-none d-block py-2"><i class="bi bi-briefcase me-2"></i>Projects</a></li>
    </ul>
  </div>

  <!-- Topbar -->
  <div class="topbar d-flex justify-content-between align-items-center p-3  text-white">
    <h5 class="mb-0">Employee Panel</h5>
    <div class="welcome d-flex align-items-center">
      <img src="https://img.icons8.com/color/48/bell--v1.png" alt="bell" class="me-2">
      <h6 class="mb-0">
        Welcome, <span style="color:yellow;">{{ username }}</span>
        <span id="time" style="color:lightgreen; font-weight:bold;"></span> ⏰
      </h6>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content p-4">
    <!-- Punch Section -->
    <div id="punchSection" class="text-start">
      <button id="punchBtn" class="btn btn-primary btn-lg punchBtnstyle">Punch</button>
    </div>

    <!-- Attendance Section -->
    <div id="attendanceSection" class="mt-4" style="display:none;">
      <h4>Attendance Record</h4>
      <table class="table table-bordered mt-3 bg-white">
        <thead class="table-primary">
  <tr>
    <th>Date</th>
    <th>Day</th>
    <th>Punch In</th>
    <th>Punch Out</th>
    <th>Status</th>
  </tr>
</thead>
        <tbody id="attendanceTableBody"></tbody>
      </table>
    </div>

    <!-- Leave Section -->
<div id="leaveSection" class="mt-4" style="display:none;">
    <h4>Apply for Leave</h4>

    <div class="card p-3 mt-3">
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">Leave Type</label>
                <select id="leaveType" class="form-select">
                    <option value="">Select Leave Type</option>
                    <option value="Sick Leave">Sick Leave</option>
                    <option value="Casual Leave">Casual Leave</option>
                    <option value="Paid Leave">Paid Leave</option>
                    <option value="Half Day">Half Day</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">From Date</label>
                <input type="date" id="fromDate" class="form-control">
            </div>

            <div class="col-md-4">
                <label class="form-label">To Date</label>
                <input type="date" id="toDate" class="form-control">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select id="leaveStatus" class="form-select">
                    <option value="Pending">Pending</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Total Days</label>
                <input type="text" id="totalDays" class="form-control" readonly>
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <button id="applyLeaveBtn" class="btn btn-success w-100">Apply Leave</button>
            </div>
        </div>
    </div>

    <h5 class="mt-4">Leave History</h5>
    <table class="table table-bordered bg-white">
        <thead class="table-primary">
  <tr>
    <th>Date</th>
    <th>Day</th>
    <th>Punch In</th>
    <th>Punch Out</th>
    <th>Status</th>
  </tr>
</thead>
        <tbody id="leaveTableBody"></tbody>
    </table>
</div>
  </div>

  <!-- ============================================ -->


<script>
/* ===================== LIVE CLOCK ===================== */
function updateTime() {
  const now = new Date();
  document.getElementById('time').textContent =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateTime, 1000);
updateTime();

/* ===================== ELEMENTS ===================== */
const punchBtn = document.getElementById('punchBtn');

const punchMenu = document.querySelector('ul li:nth-child(1)');
const punchOutMenu = document.querySelector('ul li:nth-child(2)');
const attendanceMenu = document.querySelector('ul li:nth-child(3)');
const leaveMenu = document.querySelector('ul li:nth-child(4)');

const punchSection = document.getElementById('punchSection');
const attendanceSection = document.getElementById('attendanceSection');
const leaveSection = document.getElementById('leaveSection');

const attendanceTable = document.getElementById('attendanceTableBody');
const leaveTableBody = document.getElementById('leaveTableBody');

/* ===================== HELPERS ===================== */
function hideAllSections() {
  punchSection.style.display = "none";
  attendanceSection.style.display = "none";
  leaveSection.style.display = "none";
}

/* ===================== ATTENDANCE ===================== */
let currentMode = "punch";
let attendanceRecords =
  JSON.parse(localStorage.getItem("attendanceData")) || [];

renderAttendanceTable();

/* Sidebar Navigation */
punchMenu.addEventListener("click", () => {
  hideAllSections();
  punchSection.style.display = "block";
  currentMode = "punch";
  punchBtn.textContent = "Punch";
  punchBtn.className = "btn btn-primary btn-lg punchBtnstyle";
});

punchOutMenu.addEventListener("click", () => {
  hideAllSections();
  punchSection.style.display = "block";
  currentMode = "punchout";
  punchBtn.textContent = "Punch Out";
  punchBtn.className = "btn btn-danger btn-lg punchBtnstyle";
});

attendanceMenu.addEventListener("click", () => {
  hideAllSections();
  attendanceSection.style.display = "block";
});

leaveMenu.addEventListener("click", () => {
  hideAllSections();
  leaveSection.style.display = "block";
  renderLeaveTable();
});

/* ===================== PUNCH BUTTON ===================== */
punchBtn.addEventListener("click", () => {
  const now = new Date();
  const date = now.toISOString().split("T")[0];
  const time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const day = now.toLocaleString("en-US", { weekday: "long" });

  let today = attendanceRecords.find(r => r.date === date);

  if (currentMode === "punch") {
    if (!today) {
      attendanceRecords.push({
        date,
        punchIn: time,
        punchOut: "-",
        day
      });
      alert(`✅ Punched In at ${time}`);
    } else {
      alert("⚠️ Already punched in today");
    }
  }

  if (currentMode === "punchout") {
    if (today && today.punchOut === "-") {
      today.punchOut = time;
      alert(`👋 Punched Out at ${time}`);
    } else {
      alert("⚠️ Punch in first");
    }
  }

  localStorage.setItem("attendanceData", JSON.stringify(attendanceRecords));
  renderAttendanceTable();
});

/* ===================== ATTENDANCE TABLE ===================== */
function renderAttendanceTable() {
  attendanceTable.innerHTML = "";

  function toMinutes(timeStr) {
    if (!timeStr || timeStr === "-") return null;

    const [time, meridian] = timeStr.split(" ");
    if (!time || !meridian) return null;

    let [h, m] = time.split(":").map(Number);

    if (meridian === "PM" && h !== 12) h += 12;
    if (meridian === "AM" && h === 12) h = 0;

    return h * 60 + m;
  }

  const today = new Date();
  const currentMonth = today.getMonth();
  const currentYear = today.getFullYear();
  const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

  const todayDate = today.getDate();

for (let day = 1; day <= todayDate; day++) {
    const dateObj = new Date(currentYear, currentMonth, day);
    const date = dateObj.toISOString().split("T")[0];
    const dayName = dateObj.toLocaleString("en-US", { weekday: "long" });

    let record = attendanceRecords.find(r => r.date === date);

    let punchIn = "-";
    let punchOut = "-";
    let status = "";
    let bgColor = "";

    if (dayName === "Sunday") {
      status = "Holiday";
      bgColor = "black";
    }
  else if (!record && dateObj < today) {
  status = "Absent";
  bgColor = "orange";
}
else if (!record && dateObj.toDateString() === today.toDateString()) {
  status = "";
  bgColor = "";
}
    else {
      punchIn = record.punchIn || "-";
      punchOut = record.punchOut || "-";

      const punchInMin = toMinutes(punchIn);
      const punchOutMin = toMinutes(punchOut);

      const OFFICE_START = 9 * 60 + 45; // 9:45
      const HALF_DAY_TIME = 13 * 60 + 30; // 1:30

      if (punchOut === "-") {
        status = "In Progress";
        bgColor = "teal";
      }
      else if (punchOutMin <= HALF_DAY_TIME) {
        status = "Half Day";
        bgColor = "brown";
      }
      else if (punchInMin <= OFFICE_START) {
        status = "Present";
        bgColor = "green";
      }
      else {
        status = "Late";
        bgColor = "red";
      }
    }

    const tr = document.createElement("tr");

   const rowColors = {
  "Present": "#d4edda",      // light green
  "Late": "#f8d7da",         // light red
  "Half Day": "#d2b48c",     // brown
  "In Progress": "#d1f2eb",  // teal
  "Absent": "#ffe5b4",       // orange
  "Holiday": "#d6d6d6"       // grey
};

tr.style.backgroundColor = rowColors[status];

tr.innerHTML = `
  <td>${date}</td>
  <td>${dayName}</td>
  <td>${punchIn}</td>
  <td>${punchOut}</td>
  <td>
    <span style="
      background:${bgColor};
      color:white;
      padding:6px 12px;
      border-radius:8px;
      font-weight:600;
      display:inline-block;
      min-width:120px;
      text-align:center;
    ">
      ${status}
    </span>
  </td>
`;

    attendanceTable.appendChild(tr);
  }
}
/* ---------- RUN DATE FIX ONLY ONCE ---------- */
attendanceRecords = attendanceRecords.map(r => {
  if (r.date && r.date.includes("/")) {
    const [mm, dd, yyyy] = r.date.split("/");
    r.date = `${yyyy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
  }
  return r;
});

localStorage.setItem("attendanceData", JSON.stringify(attendanceRecords));

/* ===================== LEAVE ===================== */
/* ===================== LEAVE ===================== */

// ✅ ELEMENTS (MOST IMPORTANT FIX)
const leaveType     = document.getElementById("leaveType");
const fromDate      = document.getElementById("fromDate");
const toDate        = document.getElementById("toDate");
const totalDays     = document.getElementById("totalDays");
const leaveStatus   = document.getElementById("leaveStatus");
const applyLeaveBtn = document.getElementById("applyLeaveBtn");

// ✅ LOAD STORED DATA
let leaveRecords = JSON.parse(localStorage.getItem("leaveData")) || [];

// ✅ AUTO CALCULATE DAYS
fromDate.addEventListener("change", calcDays);
toDate.addEventListener("change", calcDays);

function calcDays() {
  if (!fromDate.value || !toDate.value) return;

  const from = new Date(fromDate.value);
  const to   = new Date(toDate.value);

  if (to >= from) {
    totalDays.value =
      Math.ceil((to - from) / (1000 * 60 * 60 * 24)) + 1;
  } else {
    totalDays.value = "";
  }
}

// ✅ APPLY LEAVE
applyLeaveBtn.addEventListener("click", () => {

  if (!leaveType.value || !fromDate.value || !toDate.value) {
    alert("⚠️ Please fill all fields");
    return;
  }

  const leaveObj = {
    type: leaveType.value,
    from: fromDate.value, // YYYY-MM-DD
    to: toDate.value,
    days: totalDays.value,
    status: leaveStatus.value
  };

  leaveRecords.push(leaveObj);

  // ✅ STORE PROPERLY
  localStorage.setItem("leaveData", JSON.stringify(leaveRecords));

  alert("✅ Leave Applied Successfully");

  renderLeaveTable();
});

// ✅ RENDER TABLE (CRITICAL)
function renderLeaveTable() {
  leaveTableBody.innerHTML = "";

  leaveRecords.forEach(l => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${l.type}</td>
      <td>${l.from}</td>
      <td>${l.to}</td>
      <td>${l.days}</td>
      <td>${l.status}</td>
    `;
    leaveTableBody.appendChild(tr);
  });
}

// ✅ VERY IMPORTANT (PAGE LOAD)
renderLeaveTable();

</script>




<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
