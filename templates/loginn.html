<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Employee Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
body {
    background: linear-gradient(135deg, #0c3a7f 0%, #0a2753 100%);
    min-height: 100vh;
}
      .card {
        border: none;
        border-radius: 20px;
      }
      .card-body {
    flex: 1 1 auto;
    padding: 1rem 1rem;
    background-color: #011a40;
}
      .btn-primary {
        border-radius: 10px;
      }
      .logo {
    width: 150px;
    display: block;
    margin: 0 auto 15px auto;
}
h4{
    color: #ffffff;
}
.form-check {
    display: block;
    min-height: 1.5rem;
    padding-left: 1.5em;
    margin-bottom: .125rem;
    color: #fff;
}
    </style>
  </head>

  <body class="d-flex align-items-center justify-content-center">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
          <div class="card shadow-lg">
            <div class="card-body p-4">
              <!-- Logo -->
              <img src="/static/images/krishny-logo.png" alt="Logo" class="logo">
              <h4 class="card-title text-center mb-2 fw-bold">Employee Login</h4>
              <p class="text-muted small text-center mb-4">Enter your credentials to continue</p>

              <!-- ✅ Display messages from backend -->
              {% if msg %}
                <div class="alert alert-warning text-center py-2">{{ msg }}</div>
              {% endif %}
              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-{{ message.tags }} text-center py-2">{{ message }}</div>
                {% endfor %}
              {% endif %}

              <!-- ✅ Login Form -->
              <form action="/loginform/" method="POST">
                {% csrf_token %}
                <div class="form-floating mb-3">
                  <input type="text" name="username" class="form-control" id="floatingUsername" placeholder="Username" required>
                  <label for="floatingUsername">Username</label>
                </div>

                <div class="form-floating mb-3">
                  <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                  <label for="floatingPassword">Password</label>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberCheck">
                    <label class="form-check-label small" for="rememberCheck">Remember me</label>
                  </div>
                  <a href="#" class="small text-decoration-none">Forgot?</a>
                </div>

                <div class="d-grid">
                  <button class="btn btn-primary btn-lg shadow-sm" type="submit">Login</button>
                </div>
              </form>
            </div>
          </div>

          <p class="text-center text-white small mt-3">
            Don't have an account?
            <a href="/registr/" class="text-white fw-bold text-decoration-underline">Sign up</a>
          </p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
